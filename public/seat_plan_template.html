<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>পরীক্ষার সিট প্ল্যান কার্ড - আন্-নূর ইসলামিক একাডেমি</title>
  
  <!-- Google Fonts for Bengali & English Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==============================================================
       RESET & BASE STYLES
       ============================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    body {
      font-family: 'Hind Siliguri', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      padding: 20px;
    }

    /* ==============================================================
       NON-PRINTING CONTROL PANEL / TOOLBAR
       ============================================================== */
    .no-print-toolbar {
      max-width: 1100px;
      margin: 0 auto 24px auto;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 18px 24px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }

    .toolbar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 14px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .toolbar-title {
      font-size: 18px;
      font-weight: 700;
      color: #047857;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease-in-out;
      font-family: inherit;
    }

    .btn-primary {
      background: #059669;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(5, 150, 105, 0.3);
    }
    .btn-primary:hover {
      background: #047857;
    }

    .btn-outline {
      background: #ffffff;
      color: #334155;
      border-color: #cbd5e1;
    }
    .btn-outline:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }

    .toolbar-controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      font-size: 13px;
    }

    .control-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .control-item label {
      font-weight: 600;
      color: #475569;
    }

    .control-item input, .control-item select {
      padding: 7px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
    }
    .control-item input:focus, .control-item select:focus {
      border-color: #059669;
      box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.15);
    }

    .instruction-note {
      margin-top: 14px;
      padding: 10px 14px;
      background: #ecfdf5;
      border-left: 4px solid #059669;
      border-radius: 4px;
      font-size: 12.5px;
      color: #065f46;
      line-height: 1.5;
    }

    /* ==============================================================
       A4 PRINT PAGE CONTAINER
       ============================================================== */
    .print-sheet {
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto 30px auto;
      background: #ffffff;
      padding: 6mm 6mm;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      position: relative;
      box-sizing: border-box;
      page-break-after: always;
    }

    /* ==============================================================
       GRID LAYOUTS (12 Cards / 8 Cards / 6 Cards)
       ============================================================== */
    /* 12 Cards per Page: 3 cols x 4 rows (Exact match to reference image) */
    .grid-12 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 3.5mm 3.5mm;
      height: 284mm;
    }

    /* 8 Cards per Page: 2 cols x 4 rows (Spacious & larger font) */
    .grid-8 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 4.5mm 4.5mm;
      height: 284mm;
    }

    /* 6 Cards per Page: 2 cols x 3 rows (Extra large) */
    .grid-6 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6mm 6mm;
      height: 284mm;
    }

    /* ==============================================================
       SEAT PLAN CARD COMPONENT
       ============================================================== */
    .seat-card {
      position: relative;
      background: #ffffff;
      border: 1.2px solid #1e293b;
      border-radius: 5px;
      padding: 5px 7px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* Card Themes */
    .theme-classic .seat-card {
      border: 1.2px solid #0f172a;
    }

    .theme-emerald .seat-card {
      border: 1.5px solid #047857;
      background: #ffffff;
    }
    .theme-emerald .card-badge {
      background: #047857 !important;
      color: #ffffff !important;
      border-color: #047857 !important;
    }
    .theme-emerald .madrasah-name {
      color: #065f46 !important;
    }
    .theme-emerald .roll-box-header {
      background: #047857 !important;
      color: #ffffff !important;
    }
    .theme-emerald .roll-box {
      border-color: #047857 !important;
    }

    .theme-navy .seat-card {
      border: 1.5px solid #1e3a8a;
      background: #ffffff;
    }
    .theme-navy .card-badge {
      background: #1e3a8a !important;
      color: #ffffff !important;
      border-color: #1e3a8a !important;
    }
    .theme-navy .madrasah-name {
      color: #1e3a8a !important;
    }
    .theme-navy .roll-box-header {
      background: #1e3a8a !important;
      color: #ffffff !important;
    }
    .theme-navy .roll-box {
      border-color: #1e3a8a !important;
    }

    /* Watermark background logo */
    .card-watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 75px;
      height: 75px;
      opacity: 0.055;
      pointer-events: none;
      z-index: 1;
    }

    /* Card Header */
    .card-header {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      border-bottom: 1px dashed #cbd5e1;
      padding-bottom: 4px;
      margin-bottom: 4px;
    }

    .student-photo-wrapper {
      width: 42px;
      height: 48px;
      border: 1px solid #64748b;
      border-radius: 4px;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .student-photo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .inst-center {
      text-align: center;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 2px;
    }

    .madrasah-name {
      font-family: 'Noto Serif Bengali', 'Times New Roman', serif;
      font-size: 11.5px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.15;
      letter-spacing: -0.2px;
      white-space: nowrap;
    }

    .inst-address {
      font-size: 8px;
      color: #475569;
      line-height: 1.1;
      margin-top: 1px;
      white-space: nowrap;
    }

    .card-badge {
      display: inline-block;
      font-size: 8.5px;
      font-weight: 700;
      color: #0f172a;
      background: #ffffff;
      border: 1px solid #334155;
      border-radius: 9999px;
      padding: 0.5px 7px;
      margin-top: 2.5px;
      line-height: 1.25;
      letter-spacing: 0.2px;
    }

    .inst-logo-wrapper {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .inst-logo-wrapper img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Card Body */
    .card-body {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 6px;
      flex-grow: 1;
    }

    .student-info-table {
      flex-grow: 1;
      border-collapse: collapse;
      font-size: 9.5px;
      line-height: 1.35;
    }

    .student-info-table td {
      padding: 0.5px 0;
      vertical-align: middle;
    }

    .info-label {
      font-weight: 600;
      color: #334155;
      white-space: nowrap;
      width: 42px;
    }

    .info-colon {
      width: 8px;
      text-align: center;
      color: #64748b;
      font-weight: 600;
    }

    .info-val {
      font-weight: 700;
      color: #0f172a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 95px;
    }

    /* Roll Box (Right side highlighted box matching sample photo) */
    .roll-box-container {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .roll-box {
      border: 1.2px solid #0f172a;
      border-radius: 4px;
      width: 50px;
      text-align: center;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .roll-box-header {
      background: #f1f5f9;
      font-size: 8.5px;
      font-weight: 700;
      color: #0f172a;
      padding: 1px 0;
      border-bottom: 1px solid #0f172a;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .roll-box-value {
      font-size: 16px;
      font-weight: 900;
      color: #0f172a;
      line-height: 1.2;
      padding: 2px 0 1px 0;
      font-family: 'Inter', sans-serif;
    }

    /* Bottom Exam Meta / Cutting Line indicator */
    .card-footer {
      position: relative;
      z-index: 2;
      margin-top: 3px;
      padding-top: 2px;
      border-top: 1px dotted #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 7.5px;
      color: #64748b;
      font-weight: 500;
    }

    .footer-exam {
      font-weight: 600;
      color: #334155;
    }

    /* Scissor cutting guides between cards */
    .cutting-guides {
      position: relative;
    }
    .has-cut-lines .seat-card::after {
      content: "✂ - - - - - - - - - - - - - - - - - -";
      position: absolute;
      bottom: -4mm;
      left: 0;
      width: 100%;
      font-size: 8px;
      color: #94a3b8;
      text-align: center;
      overflow: hidden;
      pointer-events: none;
      white-space: nowrap;
      display: none; /* handled in grid spacing */
    }

    /* Adjustments for 8-card grid (larger cards) */
    .grid-8 .seat-card {
      padding: 8px 12px;
    }
    .grid-8 .madrasah-name {
      font-size: 14px;
    }
    .grid-8 .inst-address {
      font-size: 9.5px;
    }
    .grid-8 .card-badge {
      font-size: 10px;
      padding: 1px 10px;
    }
    .grid-8 .student-photo-wrapper {
      width: 50px;
      height: 58px;
    }
    .grid-8 .inst-logo-wrapper {
      width: 50px;
      height: 50px;
    }
    .grid-8 .student-info-table {
      font-size: 11px;
      line-height: 1.45;
    }
    .grid-8 .info-label {
      width: 55px;
    }
    .grid-8 .info-val {
      max-width: 150px;
    }
    .grid-8 .roll-box {
      width: 65px;
    }
    .grid-8 .roll-box-header {
      font-size: 10px;
      padding: 2px 0;
    }
    .grid-8 .roll-box-value {
      font-size: 22px;
      padding: 4px 0 3px 0;
    }
    .grid-8 .card-footer {
      font-size: 9px;
    }

    /* Adjustments for 6-card grid (extra large cards) */
    .grid-6 .seat-card {
      padding: 12px 16px;
    }
    .grid-6 .madrasah-name {
      font-size: 16px;
    }
    .grid-6 .inst-address {
      font-size: 11px;
    }
    .grid-6 .card-badge {
      font-size: 11.5px;
      padding: 2px 12px;
    }
    .grid-6 .student-photo-wrapper {
      width: 60px;
      height: 70px;
    }
    .grid-6 .inst-logo-wrapper {
      width: 60px;
      height: 60px;
    }
    .grid-6 .student-info-table {
      font-size: 13px;
      line-height: 1.55;
    }
    .grid-6 .info-label {
      width: 65px;
    }
    .grid-6 .info-val {
      max-width: 180px;
    }
    .grid-6 .roll-box {
      width: 80px;
    }
    .grid-6 .roll-box-header {
      font-size: 11.5px;
      padding: 3px 0;
    }
    .grid-6 .roll-box-value {
      font-size: 28px;
      padding: 6px 0 4px 0;
    }
    .grid-6 .card-footer {
      font-size: 10.5px;
    }

    /* ==============================================================
       PRINT OPTIMIZATIONS (@media print)
       ============================================================== */
    @media print {
      @page {
        size: A4 portrait;
        margin: 5mm;
      }

      body {
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      .no-print-toolbar {
        display: none !important;
      }

      .print-sheet {
        margin: 0 !important;
        padding: 2mm 2mm !important;
        box-shadow: none !important;
        border: none !important;
        width: 100% !important;
        min-height: 100vh !important;
        page-break-after: always;
      }

      .grid-12 {
        height: 282mm !important;
        gap: 2.5mm 2.5mm !important;
      }

      .grid-8 {
        height: 282mm !important;
        gap: 3.5mm 3.5mm !important;
      }

      .grid-6 {
        height: 282mm !important;
        gap: 5mm 5mm !important;
      }
    }
  </style>
</head>
<body class="theme-classic">

  <!-- ==============================================================
       INTERACTIVE TOOLBAR / CONTROLLER
       ============================================================== -->
  <div class="no-print-toolbar">
    <div class="toolbar-header">
      <div class="toolbar-title">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="9" y1="21" x2="9" y2="9"></line>
        </svg>
        <span>পরীক্ষার সিট প্ল্যান কার্ড জেনারেটর (Seat Plan Card Template)</span>
      </div>
      <div class="btn-group">
        <button class="btn btn-outline" onclick="loadSampleData(12)">
          🔄 ১২ জন শিক্ষার্থী লোড করুন
        </button>
        <button class="btn btn-outline" onclick="toggleLanguage()">
          🌐 ভাষা পরিবর্তন (বাংলা/English)
        </button>
        <button class="btn btn-primary" onclick="window.print()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 6 2 18 2 18 9"></polyline>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
            <rect x="6" y="14" width="12" height="8"></rect>
          </svg>
          প্রিন্ট করুন (Print A4)
        </button>
      </div>
    </div>

    <!-- Live Customizer Inputs -->
    <div class="toolbar-controls">
      <div class="control-item">
        <label>প্রতি পেজে কার্ড সংখ্যা (Grid Layout):</label>
        <select id="layoutSelect" onchange="changeLayout(this.value)">
          <option value="grid-12" selected>১২টি কার্ড / পৃষ্ঠা (৩ × ৪) — ছবির মতো স্ট্যান্ডার্ড</option>
          <option value="grid-8">৮টি কার্ড / পৃষ্ঠা (২ × ৪) — মাঝারি ও স্পষ্ট</option>
          <option value="grid-6">৬টি কার্ড / পৃষ্ঠা (২ × ৩) — লার্জ সাইজ</option>
        </select>
      </div>

      <div class="control-item">
        <label>কালার থিম (Design Theme):</label>
        <select id="themeSelect" onchange="changeTheme(this.value)">
          <option value="theme-classic" selected>ক্লাসিক ব্ল্যাক & হোয়াইট (ছবির মতো)</option>
          <option value="theme-emerald">ইসলামিক এমারেল্ড গ্রিন (Royal Green)</option>
          <option value="theme-navy">এলিগেন্ট নেভি ব্লু (Navy Blue)</option>
        </select>
      </div>

      <div class="control-item">
        <label>মাদরাসার নাম:</label>
        <input type="text" id="madrasahNameInput" value="আন্-নূর ইসলামিক একাডেমি" oninput="updateAllCards()">
      </div>

      <div class="control-item">
        <label>ঠিকানা / সাবটাইটেল:</label>
        <input type="text" id="madrasahAddressInput" value="শাহীবাগ জামে মসজিদ সংলগ্ন, চাঁপাইনবাবগঞ্জ" oninput="updateAllCards()">
      </div>

      <div class="control-item">
        <label>পরীক্ষার নাম (Exam Title):</label>
        <input type="text" id="examTitleInput" value="বার্ষিক পরীক্ষা - ২০২৬" oninput="updateAllCards()">
      </div>

      <div class="control-item">
        <label>ব্যাজ টেক্সট (Card Badge):</label>
        <input type="text" id="badgeTextInput" value="Exam Seat Plan" oninput="updateAllCards()">
      </div>

      <div class="control-item">
        <label>ছবি প্রদর্শন (Student Photo):</label>
        <select id="photoOption" onchange="togglePhotos(this.value)">
          <option value="avatar" selected>ইসলামিক টুপি পরিহিত ফটো অবতার</option>
          <option value="blank">ফটো বক্স ফাঁকা রাখুন</option>
        </select>
      </div>

      <div class="control-item">
        <label>কক্ষ / বেঞ্চ ফিল্ড:</label>
        <select id="roomOption" onchange="toggleRoom(this.value)">
          <option value="show" selected>কক্ষ নম্বর দেখান</option>
          <option value="hide">কক্ষ নম্বর লুকান</option>
        </select>
      </div>
    </div>

    <div class="instruction-note">
      💡 <strong>টিপস:</strong> A4 পেজে ১২টি কার্ড একসাথে প্রিন্ট হয়ে বের হবে। প্রিন্ট করার পর কাঁচি (Scissors) দিয়ে দাগ বরাবর কেটে প্রতিটি ছাত্রের ডেস্কে/বেঞ্চে আঠা দিয়ে সহজে লাগানো যাবে। রোল নম্বরটি বড় বক্সে দূর থেকে স্পষ্ট দেখা যাবে।
    </div>
  </div>

  <!-- ==============================================================
       PRINTABLE A4 CONTAINER
       ============================================================== -->
  <div class="print-sheet">
    <div class="grid-12" id="cardGrid">
      <!-- Cards will be populated by JavaScript -->
    </div>
  </div>

  <!-- ==============================================================
       JAVASCRIPT DYNAMIC DATA & INTERACTIVITY
       ============================================================== -->
  <script>
    // Sample Student Database
    const initialStudents = [
      { id: "ANI-101", name: "মুহাম্মদ আব্দুল্লাহ", class: "হিফজ বিভাগ", group: "৩০ পারা", roll: "০১", room: "১০১" },
      { id: "ANI-102", name: "মোঃ রাকিব হাসান", class: "নূরানী ৩য় জামাত", group: "নাজেরা শাখা", roll: "০২", room: "১০১" },
      { id: "ANI-103", name: "মাহমুদুল হাসান", class: "নূরানী ২য় জামাত", group: "কায়দা শাখা", roll: "০৩", room: "১০১" },
      { id: "ANI-104", name: "আহমাদুল্লাহ সাকিব", class: "হিফজ বিভাগ", group: "২০ পারা", roll: "০৪", room: "১০১" },
      { id: "ANI-105", name: "তামিম ইকবাল তানভীর", class: "নূরানী ১ম জামাত", group: "আমপারা শাখা", roll: "০৫", room: "১০২" },
      { id: "ANI-106", name: "সাঈদ বিন জাবের", class: "হিফজ বিভাগ", group: "১০ পারা", roll: "০৬", room: "১০২" },
      { id: "ANI-107", name: "মুহসিনুল ইসলাম", class: "নূরানী ৩য় জামাত", group: "বাংলা ও গণিত", roll: "০৭", room: "১০২" },
      { id: "ANI-108", name: "আবু হুরায়রা তানজিম", class: "হিফজ বিভাগ", group: "১৫ পারা", roll: "০৮", room: "১০২" },
      { id: "ANI-109", name: "সালমান ফারসি", class: "নূরানী ২য় জামাত", group: "সাধারণ শাখা", roll: "০৯", room: "১০৩" },
      { id: "ANI-110", name: "মারুফ বিল্লাহ", class: "নূরানী ১ম জামাত", group: "ক শাখা", roll: "১০", room: "১০৩" },
      { id: "ANI-111", name: "মুস্তাকিম আহমেদ", class: "হিফজ বিভাগ", group: "২৫ পারা", roll: "১১", room: "১০৩" },
      { id: "ANI-112", name: "ইয়াসিন আরাফাত", class: "নূরানী ৩য় জামাত", group: "খ শাখা", roll: "১২", room: "১০৩" }
    ];

    let currentStudents = [...initialStudents];
    let isBangla = true;

    // Boy with Islamic prayer cap (Topi) SVG Avatar
    const boyAvatarSvg = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%"><rect width="100" height="120" fill="%23f1f5f9"/><circle cx="50" cy="50" r="24" fill="%23fbcfe8"/><path d="M26,50 C26,30 74,30 74,50 Z" fill="%23ffffff" stroke="%23cbd5e1" stroke-width="2"/><ellipse cx="50" cy="32" rx="20" ry="8" fill="%23ffffff" stroke="%23cbd5e1" stroke-width="1.5"/><circle cx="42" cy="52" r="2.5" fill="%23334155"/><circle cx="58" cy="52" r="2.5" fill="%23334155"/><path d="M47,60 Q50,64 53,60" fill="none" stroke="%23e11d48" stroke-width="1.5" stroke-linecap="round"/><path d="M15,115 C15,85 85,85 85,115 Z" fill="%23059669"/></svg>`;

    // Blank photo placeholder SVG
    const blankPhotoSvg = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%"><rect width="100" height="120" fill="%23f8fafc"/><path d="M50,30 A18,18 0 1,0 50,66 A18,18 0 1,0 50,30 Z M20,110 C20,80 80,80 80,110 Z" fill="%23cbd5e1"/></svg>`;

    // Madrasah Logo fallback SVG if PNG is missing
    const logoSvg = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="%23047857" stroke="%23f59e0b" stroke-width="4"/><path d="M50,22 L65,70 L35,70 Z" fill="%23ffffff"/><circle cx="50" cy="46" r="10" fill="%23f59e0b"/><text x="50" y="86" font-size="10" font-weight="bold" fill="%23ffffff" text-anchor="middle">AN-NUR</text></svg>`;

    function renderCards() {
      const grid = document.getElementById('cardGrid');
      grid.innerHTML = '';

      const madrasahName = document.getElementById('madrasahNameInput').value;
      const madrasahAddress = document.getElementById('madrasahAddressInput').value;
      const examTitle = document.getElementById('examTitleInput').value;
      const badgeText = document.getElementById('badgeTextInput').value;
      const photoType = document.getElementById('photoOption').value;
      const roomOption = document.getElementById('roomOption').value;

      const photoSrc = photoType === 'avatar' ? boyAvatarSvg : blankPhotoSvg;

      currentStudents.forEach((st) => {
        const card = document.createElement('div');
        card.className = 'seat-card';

        const roomRow = roomOption === 'show' ? `
          <tr>
            <td class="info-label">${isBangla ? 'কক্ষ' : 'Room'}</td>
            <td class="info-colon">:</td>
            <td class="info-val">${st.room}</td>
          </tr>
        ` : '';

        card.innerHTML = `
          <!-- Watermark -->
          <img src="images/madrasah_logo.png" onerror="this.src='madrasah_logo.png'; this.onerror=()=>this.src='${logoSvg}';" class="card-watermark" alt="watermark">

          <!-- Header -->
          <div class="card-header">
            <!-- Student Photo (Left) -->
            <div class="student-photo-wrapper">
              <img src="${photoSrc}" alt="Student Photo">
            </div>

            <!-- Madrasah Info & Badge (Center) -->
            <div class="inst-center">
              <div class="madrasah-name">${madrasahName}</div>
              <div class="inst-address">${madrasahAddress}</div>
              <div class="card-badge">${badgeText}</div>
            </div>

            <!-- Madrasah Logo (Right) -->
            <div class="inst-logo-wrapper">
              <img src="images/madrasah_logo.png" onerror="this.src='madrasah_logo.png'; this.onerror=()=>this.src='${logoSvg}';" alt="Madrasah Logo">
            </div>
          </div>

          <!-- Body -->
          <div class="card-body">
            <!-- Info Table -->
            <table class="student-info-table">
              <tr>
                <td class="info-label">${isBangla ? 'নাম' : 'Name'}</td>
                <td class="info-colon">:</td>
                <td class="info-val" title="${st.name}">${st.name}</td>
              </tr>
              <tr>
                <td class="info-label">${isBangla ? 'আইডি' : 'ID'}</td>
                <td class="info-colon">:</td>
                <td class="info-val">${st.id}</td>
              </tr>
              <tr>
                <td class="info-label">${isBangla ? 'শ্রেণি' : 'Class'}</td>
                <td class="info-colon">:</td>
                <td class="info-val">${st.class}</td>
              </tr>
              <tr>
                <td class="info-label">${isBangla ? 'বিভাগ' : 'Group'}</td>
                <td class="info-colon">:</td>
                <td class="info-val">${st.group}</td>
              </tr>
              ${roomRow}
            </table>

            <!-- Roll Box (Right) -->
            <div class="roll-box-container">
              <div class="roll-box">
                <div class="roll-box-header">${isBangla ? 'রোল / Roll' : 'Roll'}</div>
                <div class="roll-box-value">${st.roll}</div>
              </div>
            </div>
          </div>

          <!-- Footer -->
          <div class="card-footer">
            <span class="footer-exam">${examTitle}</span>
            <span>সেশন: ২০২৬</span>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function changeLayout(layoutClass) {
      const grid = document.getElementById('cardGrid');
      grid.className = layoutClass;
      
      // If layout is 8 cards, slice or show 8, else 12, else 6
      if (layoutClass === 'grid-8') {
        currentStudents = initialStudents.slice(0, 8);
      } else if (layoutClass === 'grid-6') {
        currentStudents = initialStudents.slice(0, 6);
      } else {
        currentStudents = [...initialStudents];
      }
      renderCards();
    }

    function changeTheme(themeClass) {
      document.body.className = themeClass;
    }

    function updateAllCards() {
      renderCards();
    }

    function togglePhotos(val) {
      renderCards();
    }

    function toggleRoom(val) {
      renderCards();
    }

    function toggleLanguage() {
      isBangla = !isBangla;
      if (!isBangla) {
        document.getElementById('madrasahNameInput').value = "AN-NUR ISLAMIC ACADEMY";
        document.getElementById('madrasahAddressInput').value = "Adjacent to Shahibag Mosque, Chapainawabganj";
        document.getElementById('examTitleInput').value = "Annual Examination - 2026";
        document.getElementById('badgeTextInput').value = "Exam Seat Plan";
      } else {
        document.getElementById('madrasahNameInput').value = "আন্-নূর ইসলামিক একাডেমি";
        document.getElementById('madrasahAddressInput').value = "শাহীবাগ জামে মসজিদ সংলগ্ন, চাঁপাইনবাবগঞ্জ";
        document.getElementById('examTitleInput').value = "বার্ষিক পরীক্ষা - ২০২৬";
        document.getElementById('badgeTextInput').value = "Exam Seat Plan";
      }
      renderCards();
    }

    function loadSampleData(count) {
      currentStudents = initialStudents.slice(0, count);
      renderCards();
    }

    // Initial render
    window.onload = function() {
      renderCards();
    };
  </script>
</body>
</html>
