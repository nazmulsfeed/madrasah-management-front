    <title>আন্-নুর-ইসলামিক একাডেমি</title>
    <link rel="manifest" href="/manifest.json?v=3" />

    <script>
      // Global recovery handler for chunk loading errors (e.g. 404 from stale service worker cache)
      window.addEventListener('error', function(e) {
        var target = e.target;
        if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
          console.warn('Critical bundle failed to load:', target.src || target.href);
          var lastReload = sessionStorage.getItem('sw_chunk_retry');
          var now = Date.now();
          if (!lastReload || now - parseInt(lastReload, 10) > 10000) {
            sessionStorage.setItem('sw_chunk_retry', now.toString());
            if ('caches' in window) {
              caches.keys().then(function(names) {
                return Promise.all(names.map(function(name) { return caches.delete(name); }));
              }).then(function() {
                window.location.reload();
              });
            } else {
              window.location.reload();
            }
          }
        }
      }, true);
    </script>

  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('Service Worker Registered!');
              // Proactively check for updates immediately on every app visit
              reg.update();
            })
            .catch(err => console.log('Service Worker registration failed: ', err));
        });
      }
    </script>
  </body>
